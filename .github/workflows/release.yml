name: Release

on:
  workflow_dispatch:
  repository_dispatch:
    types: [design-system-release]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cedar-design-web
    steps:
      - uses: actions/checkout@v4
        with:
          path: cedar-design-web
      - uses: actions/checkout@v4
        with:
          repository: loca-spirit/design-ui
          path: design-ui
          token: ${{ secrets.DESIGN_UI_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: cedar-design-web/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            cedar-design-web/pnpm-lock.yaml
            design-ui/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - run: npm exec --yes --package="$(node -p "require('./package.json').packageManager.split('+')[0]")" -- pnpm install --frozen-lockfile
        working-directory: design-ui
      - run: pnpm install --frozen-lockfile
      - run: pnpm spec:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build:lib
      - run: pnpm package:check
      - uses: changesets/action@v1
        with:
          cwd: cedar-design-web
          version: pnpm version-packages
          publish: pnpm -r publish --access public --no-git-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
