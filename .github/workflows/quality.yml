name: Quality

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: PR number to validate (used for bot-created release PRs)
        type: string
        default: ''
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cedar-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cedar-design-web
    steps:
      - uses: actions/checkout@v4
        with:
          path: cedar-design-web
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.pull_request_number && format('refs/pull/{0}/merge', inputs.pull_request_number) || '' }}
      - name: Resolve linked pull requests
        id: linked
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
        with:
          github-token: ${{ secrets.DESIGN_SYSTEM_CI_TOKEN || github.token }}
          script: |
            const { resolve } = require(`${process.env.GITHUB_WORKSPACE}/cedar-design-web/scripts/resolve-ci-refs.cjs`);
            await resolve({ github, context, core });
      - uses: actions/checkout@v4
        with:
          repository: sparknest-team/design-ui
          path: design-ui
          ref: ${{ fromJSON(steps.linked.outputs.refs)['design-ui'] }}
          token: ${{ secrets.DESIGN_SYSTEM_CI_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sparknest-team/maple-design-mobile
          path: maple-design-mobile
          ref: ${{ fromJSON(steps.linked.outputs.refs)['maple-design-mobile'] }}
          token: ${{ secrets.DESIGN_SYSTEM_CI_TOKEN || github.token }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: cedar-design-web/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            cedar-design-web/pnpm-lock.yaml
            maple-design-mobile/pnpm-lock.yaml
            design-ui/pnpm-lock.yaml
      - run: npm exec --yes --package="$(node -p "require('./package.json').packageManager.split('+')[0]")" -- pnpm install --frozen-lockfile
        working-directory: design-ui
      - run: pnpm install --frozen-lockfile
        working-directory: maple-design-mobile
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: node ../design-ui/bin/ci-toolchain-check.mjs
      - run: node ../design-ui/bin/case-paths-check.mjs
      - run: node --test scripts/quality/demo-i18n-ci.test.mjs
        name: Verify mandatory Demo i18n CI wiring
      - run: node --test ../design-ui/bin/ci-contract.test.mjs ../design-ui/bin/ci-toolchain-check.test.mjs ../design-ui/bin/shared-source-contract.test.mjs ../design-ui/bin/case-paths-check.test.mjs ../design-ui/packages/ui-build/test/environment.test.mjs ../design-ui/browser/inventory.test.mjs ../design-ui/browser/navigation.test.mjs ../design-ui/browser/compatibility.test.mjs ../design-ui/browser/native-acceptance.test.mjs
      - name: Check changeset coverage
        if: steps.linked.outputs.pr != '' && steps.linked.outputs.release != 'true'
        run: pnpm exec changeset status --since=origin/main
      # PR 只跑 fast 通道（静态检查 + 构建 + 单测），目标 10 分钟内出结果。
      # 文档站、浏览器回归、三引擎兼容性由 quality-slow.yml 每日跑，以及 main/merge_group 的完整通道兜底。
      # 注意：两个 step 的 `run:` 必须写在第一行，demo-i18n-ci.test.mjs 用 `step.split('\n')[0]` 匹配。
      - run: pnpm quality:fast
        name: Fast quality checks (PR gate)
        if: github.event_name == 'pull_request'
      - run: pnpm quality
        name: Full quality checks (main / merge queue)
        if: github.event_name != 'pull_request'
      - name: Verify linked PRs stayed unchanged
        uses: actions/github-script@v7
        env:
          CI_LINKS: ${{ steps.linked.outputs.links }}
        with:
          github-token: ${{ secrets.DESIGN_SYSTEM_CI_TOKEN || github.token }}
          script: |
            const { validate } = require(`${process.env.GITHUB_WORKSPACE}/cedar-design-web/scripts/resolve-ci-refs.cjs`);
            await validate({ github });
      - name: Save linked PR snapshot for checked merges
        uses: actions/upload-artifact@v4
        with:
          name: ci-linked-prs-cedar-design-web
          path: ${{ runner.temp }}/linked-prs.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cedar-design-web-production-browser
          path: cedar-design-web/artifacts/docs-components
          if-no-files-found: warn
